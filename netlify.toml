# =============================================================================
# CultureRisk AI — Netlify configuration
# -----------------------------------------------------------------------------
#   public/              static cockpit (HTML + ES modules, no build step)
#   netlify/functions/   serverless API (agent, baseline, qloo_bridge)
#   netlify/lib/         shared backend modules (bundled into each function)
#
# Public routes are clean /api/* paths, rewritten to the functions:
#   GET/POST /api/agent        → agent.js        (stepwise Claude + Qloo agent)
#   POST     /api/baseline     → baseline.js     (LLM-only comparison)
#   GET      /api/qloo_bridge  → qloo_bridge.js  (single-shot quick scan)
#
# SECRETS: set these in Netlify UI → Site configuration → Environment variables:
#   QLOO_HACKATHON_API_KEY   live Qloo data (otherwise simulated)
#   ANTHROPIC_API_KEY        Claude agent engine (otherwise scripted planner)
# Never commit keys to this file.
# =============================================================================

[build]
  publish   = "public"
  functions = "netlify/functions"
  command   = "npm test"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
